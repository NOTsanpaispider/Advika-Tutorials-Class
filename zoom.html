<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Classes | ADVIKA</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #fefefe;
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #6a5914;
      color: white;
      padding: 1rem 2rem;
      border-radius: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .back-btn {
      background-color: white;
      color: #6a5914;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #f1e4b3;
    }

    .content {
      margin-top: 2rem;
    }

    .class-card {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .class-card h2 {
      margin-top: 0;
      color: #6a5914;
    }

    .join-btn {
      background-color: #6a5914;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: 0.3s ease;
    }

    .join-btn:hover {
      background-color: #4a3d0f;
      transform: scale(1.05);
    }

    .time {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Attend Live Classes</h1>
    <button class="back-btn" onclick="goBack()">Back to Dashboard</button>
  </header>

  <div class="content">
    <div class="class-card">
      <h2>English</h2>
      <p class="time">Next Class: Today at 10:00 AM</p>
      <button class="join-btn" onclick="joinClass('https://meet.example.com/english')">Join Now</button>
    </div>

    <div class="class-card">
      <h2>Math</h2>
      <p class="time">Next Class: Today at 11:30 AM</p>
      <button class="join-btn" onclick="joinClass('https://meet.example.com/math')">Join Now</button>
    </div>

    <div class="class-card">
      <h2>Science</h2>
      <p class="time">Next Class: Today at 1:00 PM</p>
      <button class="join-btn" onclick="joinClass('https://meet.example.com/science')">Join Now</button>
    </div>

    <div class="class-card">
      <h2>History</h2>
      <p class="time">Next Class: Tomorrow at 9:00 AM</p>
      <button class="join-btn" onclick="joinClass('https://meet.example.com/history')">Join Now</button>
    </div>
  </div>

  <script>
    function goBack() {
      window.location.href = "dashboard.html";
    }

    function joinClass(link) {
      window.open(link, "_blank");
    }
  </script>

</body>
</html>
