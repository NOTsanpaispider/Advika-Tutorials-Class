<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | ADVIKA TUTORIAL</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fdf6e3, #f1e4b3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: white;
      padding: 2rem 3rem;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h2 {
      margin-bottom: 1rem;
      color: #6a5914;
    }

    input {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      background-color: #6a5914;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #4a3d0f;
      transform: scale(1.05);
    }

    .error {
      color: red;
      font-size: 0.9rem;
      height: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Login to ADVIKA</h2>
    <input type="text" id="userId" placeholder="Enter User ID" />
    <input type="password" id="password" placeholder="Enter Password (if any)" />
    <button onclick="login()">Login</button>
    <p id="errorMsg" class="error"></p>
  </div>

  <script>
    const existingStd = localStorage.getItem("student_std");
    const existingRole = localStorage.getItem("user_role");

    if (existingStd && existingRole) {
      window.location.href = "dashboard.html";
    }

    const users = {
      "student1":  { password: "std01", std: "1" },
      "student2":  { password: "std02", std: "2" },
      "student3":  { password: "std03", std: "3" },
      "student4":  { password: "std04", std: "4" },
      "student5":  { password: "std05", std: "5" },
      "student6":  { password: "std06", std: "6" },
      "student7":  { password: "std07", std: "7" },
      "student8":  { password: "std08", std: "8" },
      "student9":  { password: "std09", std: "9" },
      "student10": { password: "std10", std: "10" },
      "nikita thakur": { password: "admin", std: "admin" },

      // Admins for specific classes (no password required)
      "admin1":  { password: "", std: "1" },
      "admin2":  { password: "", std: "2" },
      "admin3":  { password: "", std: "3" },
      "admin4":  { password: "", std: "4" },
      "admin5":  { password: "", std: "5" },
      "admin6":  { password: "", std: "6" },
      "admin7":  { password: "", std: "7" },
      "admin8":  { password: "", std: "8" },
      "admin9":  { password: "", std: "9" },
      "admin10": { password: "", std: "10" }
    };

    function login() {
      const id = document.getElementById("userId").value.trim().toLowerCase();
      const pass = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      const user = users[id];

      if (user && (user.password === pass || user.password === "")) {
        const std = user.std;
        const role = id.startsWith("admin") || std === "admin" ? "admin" : "student";

        localStorage.setItem("student_name", id);
        localStorage.setItem("student_std", std);
        localStorage.setItem("user_role", role);

        window.location.href = "dashboard.html";
      } else {
        errorMsg.textContent = "Invalid ID or Password. Try again.";
      }
    }
  </script>

</body>
</html>
